[workspace]
members = ["core", "api", "operator","client", "libs/maskass", "libs/ferriskey-security", "libs/ferriskey-domain", "libs/ferriskey-trident", "libs/ferriskey-abyss", "libs/ferriskey-aegis", "libs/ferriskey-compass", "libs/ferriskey-mail", "libs/ferriskey-migrate", "libs/ferriskey-organization", "libs/ferriskey-seawatch", "libs/ferriskey-password-policy", "libs/ferriskey-webhook", "libs/ferriskey-portal-theme", "libs/ferriskey-portal-layouts", "libs/ferriskey-api-core", "libs/ferriskey-api-seawatch"]
resolver = "2"

[workspace.package]
version = "0.7.0"
authors = ["nathaelb <pro.nathaelbonnal@gmail.com>", "Baptiste Parmantier <baptiste.parmantier.pro@gmail.com>"]
edition = "2024"

[profile.release]
# Debug symbols account for ~13 MB of the 59 MB ferriskey-api binary and are
# useless in the container images.
strip = "symbols"
# Thin LTO + a single codegen unit let the linker drop cross-crate dead code.
# Slower to build, noticeably smaller (and faster) binaries.
lto = "thin"
codegen-units = 1
