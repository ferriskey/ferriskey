[package]
name = "ferriskey-benchmarks"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
ferriskey-aegis = { path = "../../libs/ferriskey-aegis" }
ferriskey-core = { path = "../../core" }
ferriskey-domain = { path = "../../libs/ferriskey-domain" }
ferriskey-seawatch = { path = "../../libs/ferriskey-seawatch" }
ferriskey-security = { path = "../../libs/ferriskey-security" }
chrono = "0.4"
jsonwebtoken = { version = "11.1.0", features = ["aws_lc_rs"] }
serde_json = "1"
tokio = { version = "1", features = ["rt"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
criterion = { package = "codspeed-criterion-compat", version = "5.0.3" }

[[bench]]
name = "password_hashing"
harness = false

[[bench]]
name = "token_signing"
harness = false

[[bench]]
name = "audit_chain"
harness = false

[[bench]]
name = "claims_assembly"
harness = false

[[bench]]
name = "client_credentials"
harness = false
