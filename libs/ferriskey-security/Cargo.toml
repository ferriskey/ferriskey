[package]
name = "ferriskey-security"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
tracing = "0.1"
ferriskey-domain = { path = "../ferriskey-domain" }
argon2 = "0.5.3"
aws-lc-rs = "1.18.1"
base64 = "0.23.1"
chrono = "0.4.43"
jsonwebtoken = { version = "11.1.0", features = ["aws_lc_rs"] }
rcgen = { version = "0.14.9", default-features = false, features = [
    "pem",
    "crypto",
    "ring",
] }
pem = "3.0.6"
serde = "1.0.228"
serde_json = "1.0.149"
sha1 = "0.10.6"
thiserror = "2.0.18"
utoipa = { version = "6.0.0", features = ["chrono", "uuid"] }
uuid = "1.20.0"
mockall = { version = "0.14.0", optional = true }

[dev-dependencies]
ferriskey-domain = { path = "../ferriskey-domain", features = ["mock"] }
mockall = "0.14.0"
tokio = { version = "1", features = ["rt", "macros"] }
x509-parser = "0.18.0"

[features]
mock = ["mockall"]
