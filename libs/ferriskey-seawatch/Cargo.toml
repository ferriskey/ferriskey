[package]
name = "ferriskey-seawatch"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
ferriskey-authz = { path = "../ferriskey-authz" }
ferriskey-domain = { path = "../ferriskey-domain" }
chrono = { version = "0.4.41", features = ["serde"] }
hex = "0.4.3"
hmac = "0.12.1"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.141"
sha2 = "0.11.1"
utoipa = { version = "5.4.0", features = ["chrono", "uuid"] }
uuid = { version = "1.16.0", features = ["serde", "v4", "v7"] }
mockall = { version = "0.14.0", optional = true }

[dev-dependencies]
serde_json = { version = "1.0.141", features = ["preserve_order"] }
ferriskey-domain = { path = "../ferriskey-domain", features = ["mock"] }
mockall = "0.14.0"
tokio = { version = "1", features = ["sync", "macros", "rt"] }

[features]
mock = ["mockall"]
