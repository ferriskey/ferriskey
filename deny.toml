[graph]
all-features = true

[advisories]
yanked = "deny"
ignore = [
    { id = "RUSTSEC-2026-0173", reason = "proc-macro-error2 is unmaintained, pulled at build time only by validator_derive and sea-bae; no maintained release of either drops it yet" },
    { id = "RUSTSEC-2024-0449", reason = "unsafe-libyaml is unmaintained, pulled only by serde_yaml in ferriskey-operator for the crdgen binary and the CRD tests; kube 4 moved to serde-saphyr" },
]

[licenses]
confidence-threshold = 0.93
unused-allowed-license = "allow"
allow = [
    "Apache-2.0",
    "0BSD",
    "BSD-2-Clause",
    "BSD-2-Clause-FreeBSD",
    "BSD-3-Clause",
    "MIT",
    "MIT-0",
    "ISC",
    "OpenSSL",
    "OpenSSL-standalone",
    "PSF-2.0",
    "Python-2.0",
    "Python-2.0.1",
    "PostgreSQL",
    "SSLeay-standalone",
    "UPL-1.0",
    "X11",
    "Zlib",
    "Unicode-3.0",
]
exceptions = [
    { crate = "webauthn-rs", allow = ["MPL-2.0"] },
    { crate = "webauthn-rs-core", allow = ["MPL-2.0"] },
    { crate = "webauthn-rs-proto", allow = ["MPL-2.0"] },
    { crate = "webauthn-attestation-ca", allow = ["MPL-2.0"] },
    { crate = "base64urlsafedata", allow = ["MPL-2.0"] },
    { crate = "cssparser", allow = ["MPL-2.0"] },
    { crate = "dtoa-short", allow = ["MPL-2.0"] },
    { crate = "webpki-roots", allow = ["CDLA-Permissive-2.0"] },
    { crate = "webpki-root-certs", allow = ["CDLA-Permissive-2.0"] },
    { crate = "ar_archive_writer", allow = ["Apache-2.0 WITH LLVM-exception"] },
]

[bans]
multiple-versions = "allow"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
