[graph]
all-features = true

[advisories]
yanked = "deny"
ignore = [
    { id = "RUSTSEC-2026-0173", reason = "proc-macro-error2 is unmaintained, pulled at build time only by validator_derive and sea-bae; no maintained release of either drops it yet" },
    { id = "RUSTSEC-2024-0449", reason = "unsafe-libyaml is unmaintained, pulled by serde_yaml through kube-client 2.x and the operator crdgen binary; kube 4 moves to serde-saphyr" },
    { id = "RUSTSEC-2026-0367", reason = "zip 3 is a build dependency of utoipa-swagger-ui, which only extracts the swagger-ui archive pinned by its own release; utoipa-swagger-ui 10 still resolves zip below 9" },
    { id = "RUSTSEC-2026-0368", reason = "same zip 3 build dependency of utoipa-swagger-ui, never given an archive we do not control" },
    { id = "RUSTSEC-2026-0369", reason = "same zip 3 build dependency of utoipa-swagger-ui, never given an archive we do not control" },
    { id = "RUSTSEC-2026-0381", reason = "webpki-roots 0.26.11 is a shim pulled by sqlx-core 0.8 that holds no certificate; it re-exports TLS_SERVER_ROOTS from webpki-roots 1.0.10, which is not affected" },
]

[licenses]
confidence-threshold = 0.93
unused-allowed-license = "allow"
allow = [
    "Apache-2.0",
    "0BSD",
    "BSD-2-Clause",
    "BSD-2-Clause-FreeBSD",
    "BSD-3-Clause",
    "MIT",
    "MIT-0",
    "ISC",
    "OpenSSL",
    "OpenSSL-standalone",
    "PSF-2.0",
    "Python-2.0",
    "Python-2.0.1",
    "PostgreSQL",
    "SSLeay-standalone",
    "UPL-1.0",
    "X11",
    "Zlib",
    "Unicode-3.0",
]
exceptions = [
    { crate = "webauthn-rs", allow = ["MPL-2.0"] },
    { crate = "webauthn-rs-core", allow = ["MPL-2.0"] },
    { crate = "webauthn-rs-proto", allow = ["MPL-2.0"] },
    { crate = "webauthn-attestation-ca", allow = ["MPL-2.0"] },
    { crate = "base64urlsafedata", allow = ["MPL-2.0"] },
    { crate = "webpki-roots", allow = ["CDLA-Permissive-2.0"] },
    { crate = "webpki-root-certs", allow = ["CDLA-Permissive-2.0"] },
    { crate = "ar_archive_writer", allow = ["Apache-2.0 WITH LLVM-exception"] },
]

[bans]
multiple-versions = "allow"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
