      description: 在登录页面向被拦截的用户展示的消息。
      placeholder: 迁移进行中，下午 2 点恢复。
    strategy:
      label: 会话策略
      description: 开启维护模式时，已打开的会话将如何处理。
  inherited:
    badge: 继承自域
    managed: 在域级别管理
  users:
    title: 允许的用户
    description: 在维护期间被逐个指定为允许的账户。域级别的条目会自动继承。
    add: 添加用户
    search_placeholder: 搜索用户…
    empty: 该客户端上没有允许的用户。
    exhausted: 该域的所有用户都已在允许列表中。
  roles:
    title: 允许的角色
    description: 维护期间，持有这些角色的所有人都被允许。域级别的条目会自动继承。
    add: 添加角色
    search_placeholder: 搜索角色…
    empty: 该客户端上没有允许的角色。
    exhausted: 该域的所有角色都已在允许列表中。
  save:
