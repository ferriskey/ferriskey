# 简体中文 catalogue for the shell, the shared components and the mutation toasts.
#
# STATUS: translated, awaiting native review. Batch #1371 rendered every entry below with the
# product glossary, but no native speaker has read it. Lines carrying a `#` note above them are
# the ones where the translator's judgement was a guess — start the review there.
#
# The keys, the {{placeholders}} and the <tags> are part of the contract — translate the words
# around them, never the markup.
#
# Chinese declares a single plural category ("other"), so the *_one forms of the English
# catalogue have no counterpart here on purpose.
#
# Sentences avoid a second-person pronoun where Chinese allows it; where possession must be
# explicit the catalogue writes 您. A reviewer who prefers 你 should change both files at once.
