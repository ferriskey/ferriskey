    equals: 等于
    not_equals: 不等于
    greater_than: 大于
    less_than: 小于
    overlaps: 有交集
    includes: 含有
    excludes: 不含有
    includes_all_of: 含有以下全部
    includes_any_of: 含有以下任一
    empty: 为空
    not_empty: 不为空
