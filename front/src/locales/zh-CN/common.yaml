  no_results: 未找到结果。
  select: 请选择…
  # Appended after a figure by the component, as in "3 项已选中".
  selected: 项已选中
  tag_hint: 输入后按回车添加标签
  boolean:
    # ⚠ These are the on/off labels of a boolean filter, not literal booleans. 是 / 否 is what a
    # Chinese filter UI shows; a reviewer wanting the literal reading would write 真 / 假.
    'true': 是
    'false': 否
  range:
    min: 最小值
    max: 最大值
    to: 至
  group:
    selected: 已选择
    fields: 字段
  # ⚠ Operator chips read as the middle of a sentence. English keeps contains/includes and
  # excludes/not_contains as distinct pairs even though they overlap; the Chinese mirrors that
  # split with 包含 for text and 含有 for lists. If the distinction is not real in the product,
  # collapse them.
  operator:
    is: 是
    is_not: 不是
    is_any_of: 是其中任一
    is_not_any_of: 不是其中任一
    includes_all: 含有全部
