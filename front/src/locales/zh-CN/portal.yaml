  missing_blocks: '缺少：{{blocks}}'
  framed_by: 由 {{name}} 框定
  no_layout: 无布局
  unsaved: 未保存
  save: 保存页面
  saving: 保存中…
  toast:
    saved: 页面已保存
    save_failed: 此页面保存失败
    unknown_error: 未知错误

layout_builder:
  name_placeholder: 布局名称
  create: 创建
  save: 保存
  saving: 保存中…

builder:
  sidebar:
    components: 组件
    presets: 预设
    tree: 树
  library:
    required_for_page: 此页面的必需块
    required_for_layout: 此布局的必需块
    group:
      layout: 布局
      content: 内容
      form: 表单与操作
      identity: 身份字段
      other: 其他
  presets:
    hint: 点击预设即可将其追加到页面。
    # TRANSLATOR NOTE: the English title says "preset deletion", but the action it confirms
    # replaces the current page tree with the preset — nothing is deleted from the preset list.
    # The Chinese follows the English literally, defect included, until the copy is fixed.
    confirm_title: 确认删除当前预设
    confirm_description: 此操作无法撤销。
  panel:
    buttons:
      title: 按钮
      description: 主要和次要 CTA 按钮，包括其形状与排版。
      section:
