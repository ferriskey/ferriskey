        shape: 形状
        typography: 排版
    inputs:
      title: 输入框
      description: 表单字段（邮箱、密码、OTP）。背景色和文字颜色沿用页面令牌；在此调整形状与标签排版。
      section:
        shape: 形状
        label_typography: 标签排版
    widget:
      # REVIEW: "widget" has no precedent in the translated catalogues. 小部件 is the common
      # Simplified Chinese rendering; 卡片 was avoided because "card" is also a block type the
      # administrator can drop on the canvas.
      title: 小部件
      description: 包裹每个认证流程的卡片——登录、注册、魔法链接等。
      section:
        surface: 表面
        shape: 形状
        spacing: 间距
    typography:
      title: 排版
      description: 字体、基准字号，以及各处使用的标题/正文/链接样式。
      section:
        family: 字体
        body_color: 正文颜色
        links: 链接
      style:
        title: 标题
        subtitle: 副标题
        body: 正文
    page:
      title: 页面
      description: 小部件背后的最外层表面，以及全局反馈颜色和间距。
      section:
        surface: 表面
        feedback: 反馈
        spacing: 间距
  control:
    background: 背景
    # In the button panels this control picks the colour of the button's own text, not the colour
    # of a form label — hence 文字 here and 标签 under inputs.section.label_typography.
    label: 文字
    border: 边框
    border_color: 边框颜色
    border_width: 边框宽度
    radius: 圆角
    shadow: 阴影
    padding: 内边距
    weight: 字重
    size: 字号
    custom_url: 自定义 URL
    base_size: 基准字号
    default_text: 默认文本
    color: 颜色
    decoration: 装饰
    error: 错误
    field_gap: 字段间距
    section_gap: 区块间距
    reset: 重置为默认值
    reset_field: 将{{label}}重置为默认值
    pick_color: 选择{{label}}的颜色
  shadow:
    none: 无
    small: 小
    large: 大
  link_style:
    normal: 常规
    underline: 下划线
  # Static mock of an authentication screen. It is console chrome, not seeded content: the wording
  # is aligned with auth.yaml so the administrator previews the same words the end user will read.
  preview:
    title: 欢迎回来
    subtitle: 登录到您的工作区。
    error: 邮箱或密码不正确。
    email: 邮箱
