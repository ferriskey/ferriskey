# 简体中文 catalogue for organizations, their members and their groups. Awaiting native review.
#
# TRANSLATORS' NOTES
#   - Two senses of "domain" collide in Chinese. The tenant boundary (realm) is 域 per the
#     glossary; the DNS / email domain of an organization is 域名. Never swap them.
#   - "account" is rendered 账户 throughout, following the glossary's 服务账户. The glossary pins
#     the compound but not the head noun; see the report.
#   - Chinese declares a single plural category ("other"), so the *_one forms of the English
#     catalogue have no counterpart here on purpose.
#   - English separates "Enabled" (sentence case) from "enabled" (pill case). Chinese has no case,
#     so both render as 已启用.

organization:
  # "organization_id" is the API field name, kept verbatim.
  identifier: 'organization_id: {{id}}'
  no_domain: 无域名
  status:
    enabled: 已启用
    disabled: 已禁用

member:
  # Stands in for the display name of a service account, which has no first or last name.
  service_account: 服务账户
  kind:
    service_account: 服务账户
    user_account: 用户账户
  status:
    active: 活动
    inactive: 非活动

form:
  sections:
    definition: 定义
    general: 常规
    routing:
      title: 联系方式与路由
      description: 可选的元数据，均非必填。
  name:
    label: 名称
    description: 在所有列出该组织的位置向管理员显示。
  alias:
    label: 别名
    description:
      create: 用于 URL 和查询的稳定标识符。仅允许小写字母、数字、连字符和下划线。
      settings: 用于 URL 和查询的稳定标识符。重命名会使已经指向此处的链接失效。
  enabled:
    label: 已启用
    description:
      create: 已禁用的组织，其成员无法访问。
      settings: 已禁用的组织会在终端用户流程中隐藏。
  domain:
    label: 域名
    # "acme.com" is an example domain, not copy. Keep it verbatim.
    description:
      create: '与此组织关联的电子邮件域名，例如 acme.com。'
      settings: '与此组织关联的主域名，例如 acme.com。'
  redirect_url:
    label: 重定向 URL
    description: 成员完成认证后到达的地址。
  description:
    label: 描述
    description: 仅管理员可见的备注。

list:
  title: 组织
  description: 共享同一域名、同一重定向并拥有各自角色的账户集合。
  create: 新建组织
  search_placeholder: 按名称、别名或域名筛选…
  count_other: '{{count}} 个组织'
  columns:
    name: 组织
    alias: 别名
    domain: 域名
    description: 描述
    status: 状态
  metrics:
    total:
      label: 总数
      # Bare noun under the total, the figure itself sits above it — no measure word here.
      hint_other: 组织
    enabled:
      label: 已启用
      hint: '占总数的 {{percent}}%'
      empty_hint: 无已启用的组织
    disabled:
      label: 已禁用
      hint: 在终端用户流程中隐藏
    domain:
      label: 已设置域名
      hint: 已绑定电子邮件域名
  aggregates:
    # Footer total, never inflected — it always reads as a raw count of enabled organizations.
    status: '{{total}} 个已启用'
  alerts:
    disabled:
      title_other: '{{count}} 个组织已被禁用'
      # "names" is the list of disabled organizations, already joined.
      detail_other: '{{names}}，其成员无法访问。'
      action: 检查
  filters:
    enabled: 已启用
    disabled: 已禁用
    without_domain: 无域名
  card:
    flags:
      reachable: 其成员可以访问
      domain: 已绑定电子邮件域名
      redirect: 登录后重定向
  empty:
    label: 暂无组织
    hint: 组织将同一家公司的账户聚合在一起，并拥有自己的域名和角色。

