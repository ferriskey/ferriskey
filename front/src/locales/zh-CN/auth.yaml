# 简体中文 catalogue for the sign-in screens. Batch #1371.
#
# These screens are read by the people signing in — not by administrators. The wording stays plain
# and avoids the console's vocabulary: a visitor here does not know what a realm, a client, a scope
# or a credential is.
#
# Where the English source itself leaks jargon ("Invalid OTP code", "WebAuthn is not supported",
# "device code charset", "missing authentication context", "Pin"), the Chinese follows it faithfully
# and the string carries a TRANSLATOR NOTE. The fix belongs in the English copy first.
#
# Chinese declares a single plural category ("other"), so the *_one forms of the English catalogue
# have no counterpart here on purpose.
#
# STATUS: awaiting native review. Strings marked "REVIEW" are the ones where a native reader's
# judgement matters most.

actions:
  back_to_login: 返回登录页
  cancel: 取消

login:
  # Shown as the heading when the realm has no display name of its own.
  title: 登录
  identifier:
    username: 用户名
    email: 邮箱
    username_or_email: 用户名或邮箱
  password: 密码
  remember_me: 记住我
  forgot_password: 忘记密码？
  submit: 登录
  # Divider between the password form and the other ways to sign in.
  separator: 或
  passkey: 使用通行密钥登录
  # REVIEW: 魔法链接 is the literal rendering kept by the glossary. A reviewer may prefer
  # 免密登录链接 ("passwordless sign-in link"), which explains instead of transliterating —
  # see the ⚠ on "magic link" in GLOSSARY.md. The choice must be made in one pass, everywhere.
  magic_link: 使用魔法链接登录
  no_account: 还没有账户？<signup>注册</signup>
  # TRANSLATOR NOTE: the English says "credentials" to an audience that has no account yet.
  # 凭据 is the glossary term and is kept, but both sides read as console vocabulary.
  failed: 认证失败。请检查您的凭据后重试。
  failure:
    title: 登录时发生错误
    description: 请重试
  rejected:
    title: 认证错误
    hint: 如果问题持续存在，请联系您的管理员。

providers:
  separator: 或使用以下方式继续
  continue_with: 使用 {{name}} 继续

register:
  # Shown as the heading when the realm name is missing from the URL.
  title: 创建账户
  username: 用户名
  email: 邮箱
  password: 密码
  confirm_password: 确认密码
  firstname: 名字
  lastname: 姓氏
  submit: 创建账户
  failed: 我们无法创建您的账户。请重试。

magic_link:
  form:
    title: 通过邮箱登录
    description: 输入您的邮箱地址，我们将向您发送一个可立即登录的链接。
    email_label: 邮箱地址
    submit: 发送魔法链接
    submitting: 发送中…
  sent:
    title: 请查看您的收件箱
    description: 我们已将魔法链接发送到您的邮箱地址。点击该链接即可登录，无需密码。
    hint: 该链接将在 15 分钟后失效。如果没有看到邮件，请检查垃圾邮件文件夹。
  verify:
    checking: 正在验证您的魔法链接…
    invalid: 此魔法链接无效或已过期。
    missing_params: 缺少魔法链接参数。
    no_redirect: 验证已成功，但未提供跳转地址。
    failed: 无法验证此魔法链接。
  toast:
    send_failed: 魔法链接发送失败
    sent: 魔法链接已发送，请查看您的收件箱。

forgot_password:
  title: 忘记密码？
  description: 输入您的邮箱地址，我们将向您发送重置密码的链接。
  email_label: 邮箱
  submit: 发送重置链接
  submitting: 发送中…
  sent: 如果该邮箱对应的账户存在，重置链接已发送。

reset_password:
  title: 设置新密码
  password_label: 新密码
  confirm_label: 确认密码
  submit: 重置密码
  submitting: 重置中…
  checking: 正在验证您的重置链接…
  invalid: 此重置链接无效或已过期。
  request_new: 申请新的重置链接
  failed: 无法重置您的密码。

update_password:
  title: 更新您的密码
  description: 您当前的密码是临时密码，必须更新后才能继续。
  password_label: 新密码
  confirm_label: 确认密码
  submit: 更新密码
  submitting: 更新中…
  requirements_label: 密码要求
  # Read out by screen readers after each requirement, never shown on screen.
  requirement_met: （已满足）
  requirement_unmet: （尚未满足）
  failed: 更新密码失败

otp:
  title: 验证码
  description: 请输入您的身份验证器应用中显示的 6 位验证码。
  description_for: 请输入您的身份验证器应用中为 <account>{{email}}</account> 显示的 6 位验证码。
  hint: 粘贴您的验证码，或逐位输入。
  submit: 登录
  submitting: 登录中…
  # TRANSLATOR NOTE: the English says "OTP code" although every other string on this page says
  # "verification code". The acronym is kept so the inconsistency stays visible for the copy fix.
  invalid: OTP 验证码无效，请重试。

configure_otp:
  title: 启用双因素认证
  description: 使用 TOTP 身份验证器应用为您的账户增加一层保护。
  step_app:
    title: 安装身份验证器应用
    description: 在您的设备上使用 Google Authenticator、Authy、Microsoft Authenticator、1Password 或任意其他 TOTP 应用。
  step_qr:
    title: 扫描二维码
    manual: 无法扫描？请手动输入此密钥：
  step_verify:
    title: 验证并为您的设备命名
    device_label: 设备名称（可选）
    backup_hint: 请将您的备用代码保存在安全的地方，万一设备丢失，您将需要它们。
  submit: 启用双因素认证
  # TRANSLATOR NOTE: "OTP" appears here and in not_ready, while the screens around it say
  # "two-factor authentication". Kept as is so the copy fix is not hidden by the translation.
  setup_failed: OTP 配置过程中出错
  not_ready: OTP 设置尚未就绪

configure_passkey:
  title: 注册通行密钥
  description: 设置通行密钥以实现免密登录。您的浏览器将提示您使用设备内置的身份验证器。
  benefits:
    secure:
      title: 安全又便捷
      description: 通行密钥使用生物识别或您设备的 PIN 码，无需记住密码。
    portable:
      title: 可跨设备使用
      description: 通过 iCloud 钥匙串、Google 密码管理器或 Windows Hello 同步。
  submit: 注册通行密钥
  submitting: 注册中…
  success: 通行密钥注册成功
  redirecting: 正在跳转…
  already_exists: 此账户已存在通行密钥。正在跳转…
  failed: 通行密钥注册失败

passkey:
  # TRANSLATOR NOTE: "WebAuthn" is the protocol name and is never translated, but an end user
  # has no idea what it is. The English should say "passkeys are not supported in this browser".
  unsupported: 此浏览器不支持 WebAuthn
  failed: 通行密钥认证失败
  start_failed: 无法启动通行密钥认证

verify_email:
  title: 验证您的邮箱
  description: 验证链接已发送到您的邮箱地址。请查看您的收件箱，并点击链接以验证您的账户。
  spam_hint: 如果没有看到这封邮件，请检查垃圾邮件文件夹。
  resend: 重新发送验证邮件
  resending: 发送中…
  # The number never inflects — it is an abbreviated seconds countdown.
  resend_in: '{{seconds}} 秒后可重新发送'
  # TRANSLATOR NOTE: "authentication context" is internal vocabulary shown to an end user.
  # Translated literally; the English needs rewording.
  missing_context: '无法重新发送邮件：缺少认证上下文'
  sent: 验证邮件已发送！请查看您的收件箱。
  resend_failed: 重新发送验证邮件失败

verify_email_state:
  checking: 正在验证您的邮箱…
  finishing: 即将完成…
  expired:
    title: 链接已过期
    description: 此验证链接已过期。请重新注册或申请新的链接。
  failed:
    title: 验证失败
    description: 此验证链接无效。

check_email:
  title: 请查看您的邮箱
  description: 我们已将验证链接发送至
  # <recipient> renders as a block element, so the English has no space before it on purpose.
  # The Chinese keeps it that way.
  description_to: 我们已将验证链接发送至<recipient>{{email}}</recipient>
  hint: 点击邮件中的链接以验证您的账户。该链接很快就会失效。

email_verified:
  title: 邮箱已验证
  description: 您的邮箱地址已确认。您现在可以登录您的账户了。
  action: 继续登录

device:
  title: 设备验证
  description: 请输入您设备上显示的代码以授权该设备。
  format_hint: 格式为 <mono>XXXX-XXXX</mono>，仅包含字母。
  consent:
    request: <app>{{name}}</app> 请求以您的身份登录。
    # Heading above the list of scopes the device will receive.
    grants: 它将获得
  approve: 批准
  approving: 批准中…
  deny: 拒绝
  denying: 拒绝中…
  approved:
    title: 设备已批准
    description: 您现在可以回到发起访问请求的设备。它应会在几秒内自动登录。
  denied:
    title: 访问被拒绝
    description: 我们已告知该设备它的请求被拒绝。您可以安全地关闭此窗口。
  retry: 验证其他代码
  failed: 无法验证此代码。请重试。

callback:
  error_title: 无法完成登录
  missing_code: 缺少授权码。请重试。
  invalid_state: 登录状态无效。请重新登录。
  failed: 无法完成登录。请重试。

session:
  expired: 会话已过期
  # The number never inflects — it is an abbreviated seconds countdown.
  refreshing: '{{seconds}} 秒后自动刷新…'
  restart: 请重新开始会话以继续。
  refresh: 刷新会话
  refresh_failed: 会话刷新失败
  refresh_failed_description: 请重试。

required_action:
  loading: 加载中…
  none: 无需执行任何操作

password:
  rules:
    min_length_other: 至少 {{count}} 个字符
    uppercase: 至少一个大写字母
    lowercase: 至少一个小写字母
    number: 至少一个数字
    special: 至少一个特殊字符
    special_detailed: '至少一个特殊字符（!@#$%^&*…）'

# Messages the pages built in the realm's own theme get back from our submit
# handlers. The pages themselves are authored by the administrator and are not
# translated here.
form:
  login_fields_required: 请输入您的用户名和密码以继续。
  login_failed: 登录失败。请重试。
  passwords_mismatch: 两次输入的密码不一致。
  register_fields_required: 邮箱和密码为必填项。
  forgot_email_required: 请输入您的邮箱以接收重置链接。
  reset_password_required: 请设置一个新密码。
  reset_link_missing: 重置链接缺失或已过期。请重新申请一个。
  reset_succeeded: 密码已更新。请使用新密码登录。
  reset_failed: 无法重置密码。
  verification_sent: 验证邮件已发送。请查看您的收件箱。
  device_code_required: 请输入您设备上显示的 8 位字符代码。
  otp_code_required: 请输入您的身份验证器应用中显示的 6 位验证码。
  otp_code_mismatch: 验证码不匹配，请使用应用中最新的验证码。

validation:
  username_required: 请输入用户名
  password_required: 请输入密码
  email_required: 请输入邮箱
  email_invalid: 邮箱地址无效
  email_invalid_hint: 请输入有效的邮箱地址
  password_confirm_required: 请确认您的密码
  password_confirm_new_required: 请确认您的新密码
  passwords_mismatch: 两次输入的密码不一致
  password_must_match: 两次输入的密码必须一致
  otp_code_length: 验证码长度至少为 6 个字符
  # TRANSLATOR NOTE: the English says "Pin" here and "Code" one line above for the same field.
  # Both are kept distinct so the inconsistency survives into the copy review.
  otp_pin_length: PIN 码长度至少为 6 个字符
  device_name_required: 设备名称长度至少为 1 个字符
  # TRANSLATOR NOTE: "device code charset" is implementation vocabulary — an end user cannot act
  # on it. Translated literally; the English should name the allowed characters instead.
  device_code_format: 格式应为 XXXX-XXXX，使用设备代码字符集。
