# 简体中文 catalogue for the console (CIAM) panel.
#
# This panel speaks to a product audience: it says "application" where the IAM panel says
# "client", and "identity" where the IAM panel says "user". The Chinese keeps that split —
# 应用 for an application, 身份 for an identity — while the IAM catalogues keep 客户端 and 用户.
#
# The authentication screens say "the person" in English where the rest of the panel says "your
# users". Both are rendered 用户 here: Chinese has no natural terse equivalent of "the person",
# and 本人 read as a legal form rather than as a human being on a sign-in page.
#
# The keys, the {{placeholders}} and the <tags> are part of the contract: translate the words
# around them, never the markup. Protocol names, grant names, brand names and URL examples are
# left in English on purpose.
#
# Chinese declares a single plural category ("other"), so the *_one forms of the English
# catalogue have no counterpart here.
#
# Status: produced without a native reviewer. Lines carrying a TRANSLATOR NOTE are the ones
# where the English itself is ambiguous and the Chinese had to pick a reading.

# Plain number, formatted for the active locale.
number: '{{value, number}}'

activity:
  # Time window every activity screen reports on. Interpolated as {{window}} in the sentences
  # below; translators may move it anywhere inside them.
  window_other: 最近 {{count}} 天
  over_window: '{{window}}内'
  nothing_recorded: 无记录
  no_failure: 无失败记录
  filter:
    all: 全部
  capped:
    title: 已限制为 {{limit, number}} 个事件
    detail_above: '本域在{{window}}内记录的事件更多；以上数字仅涵盖最近的 {{limit, number}} 个。'
    detail_below: '本域在{{window}}内记录的事件更多；以下数字仅涵盖最近的 {{limit, number}} 个。'
  event:
    columns:
      event: 事件
      outcome: 结果
      actor: 账户
      target: 目标
      origin: 来源
      when: 时间
    # TRANSLATOR NOTE: "unattributed" — shown in the Account column when the event could not be
    # tied to an account. Rendered as "not attributed", not as "anonymous".
    unattributed: 未归属
    unknown_type: 未知类型
    no_target: 无
    not_recorded: 未记录
    no_detail: 无其他详情
    flags:
      actor: 已识别账户
      origin: 已记录来源
      device: 已记录设备
  journal:
    view:
      list: 列表视图
      cards: 卡片视图
    filtered:
      label: 无匹配项
      hint: 没有条目符合当前的搜索和筛选条件。
      action: 清除筛选
    count_other: '{{count, number}} 个条目'
    partial: '{{total, number}} 个中的 {{shown, number}} 个'
  live:
    title: 实时
    description: '本域在{{window}}内记录的注册与登录，统计自 Compass 追踪的认证流程。'
    range_other: '{{count}} 天'
    metrics:
      signups: 注册
      logins: 登录
      failures: 登录失败
      accounts: 每日账户数峰值
      busiest: '{{window}}内最繁忙的一天'
    notices:
      compass_off:
        title: 本域的 Compass 追踪已关闭
        detail: 注册与登录的数量统计自被追踪的认证流程。追踪关闭后不会记录任何内容，因此本页无从统计。
      error:
        title: 活动数据不可用
        detail: 无法获取本域的活动数据。请稍后重试。
    logins:
      title: 登录
      description: '{{window}}内每天成功和失败的登录。'
      legend_logins: '<num>{{total, number}}</num> 次登录'
      legend_failures: '<num>{{total, number}}</num> 次失败'
    signups:
      title: 注册
      description: '{{window}}内每天新创建的账户。'
      legend: '<num>{{total, number}}</num> 次注册'
    flows:
      title: 最近的认证尝试
      description: 本页加载时最近被追踪到的流程。此处的内容不会自动刷新。
      loading: 加载中…
      empty: 尚未追踪到任何认证流程。每一次登录尝试都会在此新增一行。
      unidentified: 未识别到账户
  logs:
    title: 日志与事件
    description: '本域在{{window}}内记录的所有认证、凭据和管理事件，最近的排在最前。'
    filters:
      failures: 失败
      authentication: 认证
      credentials: 凭据
      administration: 管理
    metrics:
      events: 事件
      # TRANSLATOR NOTE: telegraphic in English ("capped, {{window}}") — a hint under the event
      # count meaning the count hit its ceiling within the window.
      capped: '已达上限，{{window}}'
      latest: 最近一次 {{timestamp}}
      failures: 失败
      rate: 成功率
      successful: '{{total, number}} 次成功'
      actors: 不同账户数
    notices:
      error:
        title: 事件流不可用
        detail: 无法获取最新事件。请稍后重试。
      failures:
        title_other: '{{window}}内有 {{count, number}} 个失败事件'
        top_failure: '{{label}} 占其中 {{count, number}} 个'
        top_error_code: 主要为 {{code}}
    feed:
      title: 事件流
      description: 事件类别由服务器筛选；搜索框用于在已加载的结果中进一步缩小范围。
      search_placeholder: 按事件、账户、IP 搜索…
      empty_label: 无事件
      empty_hint: '当客户登录、重置凭据以及管理员修改本域时，此事件流会逐渐填满。{{window}}内没有任何记录。'
    aggregates:
      events_other: '{{count, number}} 个事件'
      failed: '{{total, number}} 个失败'
      accounts_other: '{{count, number}} 个账户'
  sessions:
    title: 会话
    description: '本域在{{window}}内打开和撤销的会话。'
    description_with_latest: '本域在{{window}}内打开和撤销的会话，最近一次在 {{timestamp}}。'
    filters:
      opened: 已打开
      revoked: 已撤销
    metrics:
      opened: 已打开的会话
      revoked: 已撤销的会话
      none_revoked: 无撤销
      accounts: 不同账户数
      origins: 不同来源数
      no_origin: 未记录 IP 地址
      origins_hint: 出现过的 IP 地址
    notices:
      no_device_list:
        title: 不存在全域范围的活动设备列表
        detail: API 一次只能按单个账户列出和撤销会话，因此当前已登录的设备显示在各个账户页面上。全域范围内记录下来的内容就是下方的日志。
      error:
        title: 会话日志不可用
        detail: 无法获取本域的会话事件。请稍后重试。
    journal:
      title: 会话日志
      description: '每打开或撤销一个会话记录一行，并附上当时记录的设备和来源。'
      search_placeholder: 按账户、IP、设备搜索…
      empty_label: 无会话事件
      empty_hint: '当客户登录以及会话被撤销时，此日志会逐渐填满。{{window}}内没有任何记录。'
    aggregates:
      opened: '{{total, number}} 个已打开'
      revoked: '{{total, number}} 个已撤销'
      accounts_other: '{{count, number}} 个账户'
  messages:
    title: 消息投递
    description: '本域在{{window}}内尝试发送的事务性邮件，以及它所通知的 Webhook 端点。'
    filters:
      delivered: 已投递
      failed: 失败
    email_types:
      magic_link: 魔法链接
      verify_email: 邮箱验证
      reset_password: 密码重置
    metrics:
      delivered: 已投递的邮件
      failed: 投递失败
      rate: 投递成功率
      attempted: '{{total, number}} 次尝试'
      recipients: 不同收件人数
    notices:
      no_smtp:
        title: 无法读取本域的 SMTP 配置
        detail: 没有邮件服务器，本域就发不出任何事务性邮件——下方日志为空正是这个意思。
      error:
        title: 投递日志不可用
        detail: 无法获取本域的投递事件。请稍后重试。
      failed:
        title_other: '{{count, number}} 封邮件投递失败'
        detail: 每一行失败记录都附有邮件服务器返回的原因。
    columns:
      recipient: 收件人
      message: 消息
    # TRANSLATOR NOTE: shown in the Recipient column in place of a name, when only an account id
    # is known. The English is the bare word "account".
    recipient_account: 账户
    default_message: 事务性邮件
    no_template: 未记录模板
    journal:
      title: 邮件投递
      description: '本域交给邮件服务器的每一封邮件记录一行，无论是否投递成功。'
      search_placeholder: 按消息、账户搜索…
      empty_label: 无邮件投递
      empty_hint: '当本域发送魔法链接、验证邮件和密码重置邮件时，此日志会逐渐填满。{{window}}内没有任何尝试。'
    aggregates:
      attempts_other: '{{count, number}} 次尝试'
      failed: '{{total, number}} 次失败'
      recipients_other: '{{count, number}} 位收件人'
    webhooks:
      title: Webhook 端点
      description: '本域通知的端点，以及每个端点最后一次触发的时间。单次投递不会记入日志，因此没有逐次投递的状态可供显示。'
      count_other: '{{count, number}} 个端点'
      empty: 本域没有注册任何 Webhook 端点。
      triggers_other: '{{count, number}} 个触发器'
      never_fired: 从未触发

applications:
  # "flow" values are OAuth 2.0 / OpenID Connect grant names. Keep them verbatim.
  types:
    native:
      label: 移动端或桌面端
      short: 原生
      description: '安装在用户的设备上，因此任何持有该设备的人都能读取它的代码。'
      flow: Authorization Code + PKCE
    spa:
      label: 单页应用
      short: SPA
      description: '完全运行在浏览器中，因此不会获得密钥，而是依赖 PKCE。'
      flow: Authorization Code + PKCE
    web:
      label: 服务端渲染的 Web 应用
      short: Web
      description: 把密钥保存在你的服务器上，并在那里交换授权码。
      flow: Authorization Code
    m2m:
      label: 机器对机器
      short: M2M
      description: '以自身身份登录的后端或守护进程，前面没有用户。'
      flow: Client Credentials
    device:
      label: 设备或 CLI
      short: 设备
      description: '设备上没有浏览器：用户在另一块屏幕上批准该请求。'
      flow: Device Authorization Grant (RFC 8628)
    choice_description: '{{description}} 通过 {{flow}} 登录。'
