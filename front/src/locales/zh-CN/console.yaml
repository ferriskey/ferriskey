authentication:
  sign_in:
    title: 登录方式
    description: 本域的用户可以用来证明自己身份的方式。
    loading_failed:
      title: 登录方式不可用
      description: 该域没有控制台可以读取的设置。
    # TRANSLATOR NOTE: "Branding" and "Email templates" are labels owned by another catalogue;
    # if their Chinese changes there, this sentence has to follow.
    smtp_warning: '魔法链接、邮箱验证和密码找回都要发送消息，而本域没有记录任何 SMTP 配置。在“品牌”下的“邮件模板”的 SMTP 标签页中配置好服务器之前，这些方式对正在登录的用户来说都会静默失败。'
    identifiers:
      title: 标识符
      description: 用户在登录页面上输入的、用来指明自己账户的内容。
      label: 接受的标识符
      description_row: 两者可以同时接受。当一个值匹配到两个账户时，顺序决定先尝试哪一个。
      min_selected: 请至少选择一个标识符
      username:
        label: 用户名
        description: 账户开通时用户自己选定的名称。
      email:
        label: 邮箱
        description: 账户上记录的电子邮件地址。
    passwordless:
      title: 免密登录方式
      description: 在密码输入框旁一并提供。密码始终仍被接受。
      passkey_label: 通行密钥
      passkey_description: 登录页面会提供一个通行密钥按钮。用户用指纹、人脸或安全密钥解锁设备，无需输入密码。
      magic_link_label: 魔法链接
      magic_link_description: 用户输入自己的电子邮件地址，收到一个一次性登录链接。打开该链接即可免密登录。
      magic_link_ttl_label: 魔法链接有效期
      magic_link_ttl_description: 消息发出后，该链接可用多长时间。超过之后用户必须重新申请一个。
      minutes: 分钟
    mfa:
      title: 多因素认证
      description: 第一重因素通过后再要求的第二重因素。
      label: 要求第二因素
      description_row: 本域的每位用户在输入密码后都会被要求提供一次性验证码。未注册第二因素的账户会先进入注册界面，然后才能继续。
    access:
      title: 账户访问
      description: 登录页面在表单周围提供的链接和复选框。
      registration_label: 自助注册
      registration_description: '登录页面上会出现“创建账户”链接，任何人都可以在没有操作员参与的情况下开通账户。'
      email_verification_label: 邮箱验证
      email_verification_description: 新账户必须先从一封邮件中确认自己的电子邮件地址，首次登录才算完成。
      forgot_password_label: 密码找回
      forgot_password_description: '登录页面上会出现“忘记密码”链接，并向账户上记录的地址发送重置邮件。'
      remember_me_label: 保持登录
      remember_me_description: '登录页面上会出现“记住我”复选框，浏览器重启后仍保持会话。'
    protection:
      title: 登录保护
      description: 同一账户上反复失败后会发生什么。
      threshold_label: 锁定前允许的失败次数
      threshold_description: 连续输错多少次密码会锁定账户。填 0 则永不锁定。
      attempts: 次
      duration_label: 锁定时长
      duration_description: 被锁定的账户在重新接受密码之前，拒绝所有密码多长时间。
      seconds: 秒
    summary:
      passkey_on: 提供通行密钥
      passkey_off: 隐藏通行密钥
      magic_link_on: 提供魔法链接
      magic_link_off: 隐藏魔法链接
      mfa_on: 要求第二因素
      mfa_off: 第二因素可选
      lockout_on_other: 失败 {{count, number}} 次后锁定
      lockout_off: 从不锁定账户
    save_bar:
      title_other: '{{count, number}} 项未保存的更改'
      description: 这些更改将在本域的下一次登录时生效。
      cancel: 放弃
      saving: 保存中…
      submit: 保存更改
    validation:
      aliases_required: 请至少选择一个标识符
      magic_link_ttl: 魔法链接的有效期至少为一分钟
      not_negative: 不能为负数
      lockout_without_duration: 没有时长的锁定永远不会解除账户
    toast:
      updated: 登录方式已更新。
      update_failed: 更新登录方式失败
  password_policy:
    title: 密码策略
    description: '本域的密码在注册时以及每次重置时必须满足的规则。'
    loading_failed:
      title: 加载密码策略失败
      description: 该域没有控制台可以读取的密码策略。
    preview:
      title: 用户看到的内容
      description: 注册页和重置页会收到其中五条规则，并列在输入框旁边。其余规则仅在提交时检查。
      listed: 已列在页面上
      none: 无——页面只要求输入密码，不说明任何要求。
      silent: '强制执行但从不列出：{{rules}}。用户只有在提交密码后收到拒绝消息时才会知道它们。'
      expiry_other: '每个密码在 {{count, number}} 天后过期；过期之后，用户在首次登录时会被送到重置界面。'
    rules:
      min_length_other: 至少 {{count, number}} 个字符
      require_uppercase: 一个大写字母
      require_lowercase: 一个小写字母
      require_number: 一个数字
      require_special: 一个特殊字符
      min_entropy_other: '{{count, number}} 位熵'
      forbid_common: '不得是常见密码、用户名或电子邮件地址'
      check_breached: 不得是已被报告泄露的密码
    save_bar:
      title_other: '{{count, number}} 项未保存的更改'
      description: '已有的密码不会被重新检查；新规则在下一次注册或重置时生效。'
      cancel: 放弃
      saving: 保存中…
      submit: 保存更改
    toast:
      updated: 密码策略已更新。
      update_failed: 更新密码策略失败

