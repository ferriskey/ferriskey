# 简体中文 catalogue for the webhook screens and the trigger catalogue.
#
# Produced without a native reviewer — see front/src/locales/GLOSSARY.md, which fixes the domain
# terms used here (realm → 域, credential → 凭据, trigger → 触发器, delivery → 投递, webhook left in
# English). Entries carrying a "TRANSLATOR NOTE" are the ones the glossary lists as ambiguous *in
# English*: their Chinese follows the English literally, defect included, and must be re-read once a
# maintainer answers the question raised in the note.
#
# The keys, the {{placeholders}} and the <tags> are contract. In particular every key under
# trigger.* is a WebhookTrigger enum value sent by the API and must never be touched.
#
# Chinese declares a single plural category ("other"), so the *_one forms of the English catalogue
# have no counterpart here on purpose.

# Ratio pill shown on the overview card and on the detail header: subscribed triggers over the
# size of the trigger catalogue. Never inflects — both numbers are raw counters.
events_ratio: '{{selected}}/{{total}} 个事件'

