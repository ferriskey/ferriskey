# Grouping headers of the trigger picker. They group the catalogue below; they are not sent to the API.
category:
  client: 客户端
  realm: 域
  role: 角色
  user: 用户
  authentication: 认证
  webhook: Webhook

# Trigger catalogue, nested on the WebhookTrigger enum value the API sends, so "client.role.created"
# reads as trigger.client.role.created. Each description tells an administrator what the event means:
# an approximate translation makes them subscribe to the wrong thing.
#
# Labels follow one shape throughout — "<对象>已<动作>" — mirroring the Title Case event names of the
# English. Descriptions render the English indefinite article as 某个/某项 so that they stay full
# sentences and remain distinguishable from their label.
trigger:
  client:
    created:
      label: 客户端已创建
      description: 已创建新的客户端。
    updated:
      label: 客户端已更新
      description: 某个客户端已被更新。
    deleted:
      label: 客户端已删除
      description: 某个客户端已被删除。
    role:
      created:
        label: 客户端角色已创建
        description: 已创建新的客户端角色。
      updated:
        label: 客户端角色已更新
        description: 某个客户端角色已被更新。
    maintenance:
      # TRANSLATOR NOTE (glossary, unresolved in English): the copy never says what maintenance mode
      # actually does to a client — reject authentication? read-only? The Chinese below states only
      # that the mode was switched on, exactly as the English does, and deliberately adds no
      # explanation. Revisit once a maintainer documents the behaviour.
      enabled:
        label: 客户端维护模式已启用
        description: 某个客户端上的维护模式已被启用。
      # TRANSLATOR NOTE: same unresolved question as .enabled above.
      disabled:
        label: 客户端维护模式已禁用
        description: 某个客户端上的维护模式已被禁用。
    saml_config:
      # TRANSLATOR NOTE (glossary, unresolved in English): this assumes FerrisKey is the IdP and the
      # client is the SAML service provider, which is what the English says but has not been
      # confirmed. If the roles are the other way round, 服务提供商 must become 身份提供商 here.
      updated:
        label: 客户端 SAML 配置已更新
        description: 某个客户端的 SAML 服务提供商配置已被更新。
    saml_attribute_mapper:
      created:
        label: 客户端 SAML 属性映射器已创建
        description: 已向某个客户端添加 SAML 属性映射器。
      deleted:
        label: 客户端 SAML 属性映射器已删除
        description: 已从某个客户端移除 SAML 属性映射器。
  redirect_uri:
    created:
      label: 重定向 URI 已创建
      description: 已创建新的重定向 URI。
    updated:
      label: 重定向 URI 已更新
      description: 某个重定向 URI 已被更新。
    deleted:
      label: 重定向 URI 已删除
      description: 某个重定向 URI 已被删除。
  web_origin:
    # TRANSLATOR NOTE (glossary, unresolved in English): the English says "registered on a client"
    # where the structurally identical redirect_uri.created says "has been created". The Chinese
    # keeps that asymmetry rather than harmonising the two, so a reader sees the same oddity.
    created:
      label: Web 源已创建
      description: 已在某个客户端上注册 Web 源。
    deleted:
      label: Web 源已删除
      description: 已从某个客户端移除 Web 源。
  realm:
    created:
      label: 域已创建
      description: 已创建新的域。
    updated:
      label: 域已更新
      description: 某个域已被更新。
    deleted:
      label: 域已删除
      description: 某个域已被删除。
    settings:
      updated:
        label: 域设置已更新
        description: 域设置已被更新。
  role:
    created:
      label: 角色已创建
      description: 已创建新的角色。
    updated:
      label: 角色已更新
      description: 某个角色已被更新。
    deleted:
      label: 角色已删除
      description: 某个角色已被删除。
    permission:
      # TRANSLATOR NOTE (glossary, unresolved in English): with a bitmask permission model, "a role
      # permission" may mean a single bit or the whole mask. 某项 below mirrors the English singular
      # and claims nothing more; if the event actually carries the whole mask, it must become
      # 某个角色的权限集合已被更新。
      updated:
        label: 角色权限已更新
        description: 某项角色权限已被更新。
  user:
    created:
      label: 用户已创建
      description: 已创建新的用户。
    updated:
      label: 用户已更新
      description: 某个用户已被更新。
    deleted:
      label: 用户已删除
      description: 某个用户已被删除。
    email_verified:
      label: 用户邮箱已验证
      description: 某个用户已验证其电子邮件地址。
    # TRANSLATOR NOTE (glossary, unresolved in English): the label is singular ("User Bulk Deleted")
    # and the description plural ("Multiple users"). Chinese marks no number, so the disagreement
    # cannot be reproduced and simply disappears here — the English still needs fixing.
    bulk_deleted:
      label: 用户已批量删除
      description: 多个用户已被删除。
    role:
      assigned:
        label: 已为用户分配角色
        description: 已为某个用户分配角色。
      unassigned:
        label: 已解除用户的角色分配
        description: 已解除某个用户的角色分配。
    credentials:
      # TRANSLATOR NOTE (glossary, unresolved in English): "A user credentials have been deleted" is
      # ungrammatical, and the label "User Deleted Credentials" reads as if the user were the actor.
      # The Chinese below uses an agentless passive, which names no actor at all — the closest thing
      # to leaving the question open — and 凭据 marks no number, so "all of them" versus "one of
      # them" stays as undecided as in the English. Both need a maintainer's answer.
      deleted:
        label: 用户凭据已删除
        description: 某个用户的凭据已被删除。
  auth:
    # TRANSLATOR NOTE (glossary, unresolved in English): the description does not say who reset the
    # password — the user themselves or an administrator — and the two take different verbs in
    # Chinese. 已被重置 below is agentless and therefore says no more than the English does.
    # The label "Auth Reset Password" is also ungrammatical and, unlike its device_flow siblings,
    # carries an "Auth" category prefix; 认证：密码重置 keeps that prefix rather than dropping it.
    reset_password:
      label: 认证：密码重置
      description: 某个用户的密码已被重置。
    device_flow:
      initiated:
        label: 设备流程已发起
        description: 某个设备授权流程已被发起。
      # TRANSLATOR NOTE (glossary, unresolved in English): denied by the user refusing the request,
      # or by policy? The two take different verbs in Chinese. 已被拒绝 is agentless and names
      # neither, which is as far as the English goes.
      denied:
        label: 设备流程已被拒绝
        description: 某个设备授权流程已被拒绝。
      expired:
        label: 设备流程已过期
        description: 某个设备授权流程已过期。
  webhook:
    created:
      label: Webhook 已创建
      description: 已创建新的 Webhook。
    updated:
      label: Webhook 已更新
      description: 某个 Webhook 已被更新。
    deleted:
      label: Webhook 已删除
      description: 某个 Webhook 已被删除。

# Client-side form checks of the create and settings screens. They live in
# src/pages/iam/realm/validators.ts, which the webhook batch did not own.
validation:
  name_required: Webhook 名称为必填项
  endpoint_invalid: 端点必须是有效的 URL
