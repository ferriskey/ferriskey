    footer_events: '{{total}} 个事件'
    flags:
      subscribed: 至少订阅了一个事件
      triggered: 已触发
      secure: 通过 HTTPS 投递
  empty:
    label: 暂无 Webhook
    hint: Webhook 会将此域的事件通知给外部服务。

create:
  back: Webhook
  title: 新建 Webhook
  description: 配置一个端点以接收实时事件通知。
  headers:
    title: HTTP 请求头
    description: 附加到每次外发调用的请求头。读取时绝不返回其值。
  events:
    title: 要订阅的事件
    description_other: '{{total}} 个触发器中有 {{count}} 个将通知此端点。'
    description_empty: '未选择触发器：此端点将永远不会被调用。'
  save:
    title: 创建 Webhook
    description: 为此域创建一个 Webhook。
    action: 创建
  toast:
    created: Webhook 创建成功
    create_failed: 创建 Webhook 失败

detail:
