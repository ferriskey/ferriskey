  general:
    title: 常规信息
    description: Webhook 配置。
  name:
    label: Webhook 名称
    description: 用于描述此 Webhook 的名称。
  endpoint:
    label: 端点 URL
    description: 将接收事件的 HTTPS URL。
  description:
    label: 描述
    description: 此 Webhook 的可选描述。

list:
  title: Webhook
  description: 接收此域事件通知的端点。
  create: 新建 Webhook
  search_placeholder: 按名称或端点筛选…
  count_other: '{{count}} 个 Webhook'
  columns:
    name: Webhook
    endpoint: 端点
    subscribers: 事件
    triggered_at: 最近触发
  never_triggered: 从未
  metrics:
    total:
      label: 总计
      hint: 个端点
    subscriptions:
      label: 订阅
      hint: '共 {{total}} 个触发器'
    never:
      label: 从未触发
      hint: 尚无投递
