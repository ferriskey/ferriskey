    description_custom: '必填：对于自定义提供商，没有任何模板知道这些端点。'
    description_template: '已根据 {{provider}} 模板预先填好，仅在使用自托管实例时才需要修改。'
  authorization_url:
    label: 授权 URL
    description: 用户被引导至此地址授予同意。
  token_url:
    label: 令牌 URL
    description: 在此地址用授权码换取令牌。
  userinfo_url:
    label: Userinfo URL
    description_oidc: 'OIDC 中可选：声明可以来自 ID 令牌。'
    description_oauth2: 令牌签发后，从此地址读取用户资料。
  scopes:
    label: 作用域
    description: 每次授权时都会请求。
    empty_hint: 未请求任何作用域，大多数提供商会拒绝不带作用域的授权请求。
  review:
    title: 确认
    description: 将在此域中创建的内容。
    template: 模板
    protocol: 协议
  actions:
    cancel: 取消
    back: 上一步
    continue: 继续
    submit: 创建提供商
  success: 身份提供商创建成功
  error: 无法创建该身份提供商

setup:
