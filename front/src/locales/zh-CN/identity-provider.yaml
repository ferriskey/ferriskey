  steps:
    provider: 提供商
    configuration: 配置
    review: 确认
  templates:
    title: 选择提供商
    description: 模板会填好端点和作用域，只剩下您的应用凭据需要填写。
    search_placeholder: 搜索提供商…
    empty: '未找到与“{{query}}”匹配的提供商'
  credentials:
    title: '配置 {{provider}}'
    description: 由提供商控制台签发的凭据。
  alias:
    label: 别名
    description: 提供商在此域中的技术名称。它会出现在重定向 URI 中，且创建后无法更改。
  display_name:
    label: 显示名称
    description: 用户在登录页面上点击的按钮的标签。
  client_id:
    label: 客户端 ID
    description: '在 {{provider}} 创建的 OAuth 应用的标识符。'
  client_secret:
    label: 客户端密钥
    description: 以加密方式存储；创建后不会再次显示。
    show: 显示密钥
    hide: 隐藏密钥
  endpoints:
