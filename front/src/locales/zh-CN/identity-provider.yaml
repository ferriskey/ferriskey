  # "{{type}}" is the raw protocol value (oidc, oauth2); the interface uppercases it in CSS.
  provider_subtitle: '{{type}} 提供商'
  documentation: 查看配置指南
  redirect_uri_hint: 在 OAuth 应用中原样声明该地址。更改别名后它也会随之改变。
  steps:
    title: 配置步骤
    custom:
      console: 打开 OAuth 提供商的开发者控制台
