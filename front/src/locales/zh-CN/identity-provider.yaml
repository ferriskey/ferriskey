# 简体中文 catalogue for identity providers. Awaiting native review.
#
# TRANSLATORS' NOTES
#   - Vendor names (Google, GitHub, GitLab, Microsoft, Apple, Facebook, Discord, X/Twitter,
#     LinkedIn) and protocol acronyms (OIDC, OAuth2, SAML, LDAP, PKCE) are never translated.
#     "{{provider}}" is filled with the vendor name as the vendor spells it — leave it alone.
#   - "broker" is rendered 身份代理 as a noun and 代理登录 as a verb phrase. Not in the glossary;
#     see the report.
#   - Chinese declares a single plural category ("other"), so the *_one forms of the English
#     catalogue have no counterpart here on purpose.
#   - English separates "Enabled" (sentence case) from "enabled" (pill case). Chinese has no case,
#     so both render as 已启用. The distinction is lost by design, not by omission.

# Protocol acronyms, not prose. Keep OIDC, OAuth2, SAML and LDAP verbatim in every locale.
provider_type:
  oidc: OIDC
  oauth2: OAuth2
  saml: SAML
  ldap: LDAP

state:
  enabled: 已启用
  disabled: 已禁用

badge:
  enabled: 已启用
  disabled: 已禁用

not_set: 未设置
none: 无

redirect_uri:
  label: 重定向 URI
  copy: 复制重定向 URI

template_category:
  social: 社交
  enterprise: 企业
  developer: 开发者工具
  custom: 自定义

template:
  google:
    description: 使用 Google 账户登录
  discord:
    description: 使用 Discord 账户登录
  github:
    description: 使用 GitHub 账户登录
  microsoft:
    description: 使用 Microsoft 和 Azure AD 登录
  apple:
    description: 使用 Apple ID 登录
  facebook:
    description: 使用 Facebook 账户登录
  gitlab:
    description: 使用 GitLab 账户登录
  twitter:
    description: 使用 X/Twitter 账户登录
  linkedin:
    description: 使用 LinkedIn 账户登录
  # "Custom Provider" is FerrisKey's own wording, not a vendor name, so it is translated.
  custom:
    display_name: 自定义提供商
    description: 配置自定义 OAuth2/OIDC 提供商

status:
  complete:
    label: 完整
    detail: 身份代理所需的每个值均已记录。
  no_scope:
    label: 无作用域
    detail: 未请求任何作用域；大多数提供商会拒绝不带作用域的授权请求。
  incomplete:
    label: 不完整
    # "{{keys}}" is a comma-separated list of raw API field names (client_id, token_url…) and is
    # never translated.
    detail_other: '代理登录将失败，配置中缺少 {{keys}}。'

list:
  title: 身份提供商
  description: 联合到此域的外部认证源。
  add: 添加提供商
  search_placeholder: 按名称或别名筛选…
  row_delete: '删除 {{name}}'
  columns:
    provider: 提供商
    alias: 别名
    type: 类型
    configuration: 配置
    status: 状态
  flags:
    enabled: 在登录页面上提供
    trust_email: 电子邮件地址被信任为已验证
    link_only: 仅关联到已有账户
  metrics:
    total:
      label: 提供商总数
      hint: 已配置
    enabled:
      label: 已启用的提供商
      # "active" here means "in service on the login page", not the account sense of active.
      hint: '{{percent}}% 处于活动状态'
      empty_hint: 没有已启用的提供商
    disabled:
      label: 已禁用的提供商
      hint: 在登录页面上隐藏
    types:
      label: 提供商类型
      hint: 不同的协议
  alerts:
    broken:
      title: '{{name}} 无法代理登录'
      action: 修复
    degraded:
      title: '{{name}} 未请求任何作用域'
      action: 检查
  filters:
    enabled: 已启用
    disabled: 已禁用
    issues: 配置有误
  aggregates:
    provider_count_other: '{{count}} 个提供商'
    # Raw counter over the misconfigured rows, never inflected.
    to_review: '{{total}} 项待检查'
  empty:
    label: 暂无身份提供商
    hint: 联合一个外部提供商，让账户可以使用已有的凭据登录。
    popular: 常用提供商
  picker:
    title: 添加身份提供商
    description: 协议决定提供商必须声明哪些端点，因此需要在填写表单前先选定协议。
    oidc:
      description: 身份声明来自 ID 令牌，并以 userinfo 端点作为回退。
    oauth2:
      description: 普通的授权码流程；用户资料从 userinfo 端点读取。
    saml:
      description: 联合 SAML 身份提供商的功能尚未实现。
      disabled_reason: FerrisKey 无法代理 SAML 提供商，身份代理仅支持 OAuth2 和 OIDC。
    ldap:
      description: 目录是用户联合源，而不是身份提供商。
      disabled_reason: 目录在“用户联合”中配置，而不是在此处。
  delete:
    title: 删除提供商？
    description: '确定要删除“{{name}}”吗？'
    success: '提供商“{{name}}”已删除'
    error: '删除“{{name}}”失败'

create:
  back: 身份提供商
  title: 添加身份提供商
