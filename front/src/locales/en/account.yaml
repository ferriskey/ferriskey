tabs:
  overview: Personal info
  security: Security
  sessions: Sessions

unavailable:
  title: Profile unavailable
  description: Your account could not be loaded for this realm. Sign in again, then retry.

header:
  email_verified: email verified
  email_unverified: email unverified
  username_locked: username locked
  member_since_label: Member since
  member_since: Member since {{date}}
  identifier_label: Identifier

profile:
  title: Personal information
  description: What other members of this realm see, and where your notifications are sent.
  username:
    label: Username
    description: Unique login identifier for your account.
    locked_description: Your administrator has disabled username changes for this realm.
  email:
    label: Email
    description: Contact address used for notifications and password recovery.
  name:
    label: First and last name
    description: Optional — shown in the console and in the tokens issued for you.
    firstname_placeholder: First name
    lastname_placeholder: Last name
  save_bar:
    title_one: '{{count}} unsaved change'
    title_other: '{{count}} unsaved changes'
    description: Review your profile before applying the changes.
    cancel: Discard
    submit: Save changes
  toast:
    updated: Your profile was updated

sessions:
  # Plain total in a heading, it never inflects.
  title: Active sessions ({{total}})
  empty: No active sessions.
  unknown_device: Unknown device
  # Stands in for the device name inside a sentence, as in "sign out the session on this device".
  this_device: this device
  unknown_ip: Unknown IP
  never: never
  current: current
  meta: '{{ip}} · last seen {{lastSeen}} · signed in {{signedIn}}'
  revoke: Revoke
  revoke_label: Revoke the session on {{device}}
  confirm:
    title: Revoke session?
    description: This will immediately sign out the session on {{device}}.
  toast:
    revoked: Session revoked

validation:
  username_required: Username is required
  email_invalid: Invalid email address

reauth:
  title: Confirm it is you
  description: Enter your password, or a code from your authenticator, to continue.
  # Shown when the operation touches a credential, where a code alone is not enough.
  description_password: Enter your password to continue. This operation changes how you sign in, so a code from your authenticator is not enough on its own.
  password_label: Password
  otp_label: Authenticator code
  switch_to_otp: Use a code from my authenticator instead
  switch_to_password: Use my password instead
  cancel: Cancel
  submit: Confirm

security:
  pills:
    otp_on: authenticator on
    otp_off: no authenticator
    passkeys_one: '{{count}} passkey'
    passkeys_other: '{{count}} passkeys'
  password:
    title: Password
    description: Changing it signs you out everywhere else. This device stays signed in.
    current_label: Current password
    new_label: New password
    confirm_label: Confirm new password
    submit: Change password
    mismatch: The two new passwords do not match.
    required: Fill in your current password and the new one.
    toast: Your password was changed
    federated_title: Your password lives elsewhere
    # "directory" rather than "LDAP": the person reading this did not choose the integration.
    federated_description: You sign in through your organisation's directory, so your password is managed there and cannot be changed here.
  otp:
    title: Authenticator app
    description: A six-digit code from an app on your phone, asked for after your password.
    enable: Set up an authenticator
    disable: Remove
    enabled: An authenticator is set up for this account.
    disabled: No authenticator is set up for this account.
    scan_hint: Scan this with your authenticator app, then type the code it shows.
    code_label: Code from the app
    confirm: Turn it on
    cancel: Cancel
    toast_enabled: Your authenticator is set up
    toast_disabled: Your authenticator was removed
  passkeys:
    title: Passkeys
    description: Sign in with your fingerprint, face or a security key, instead of a password.
    add: Add a passkey
    unnamed: Unnamed passkey
    added: Added {{date}}
    remove: Remove this passkey
    empty_title: No passkeys yet
    empty_description: Add one to sign in without typing your password.
    unsupported_title: This browser cannot use passkeys
    unsupported_description: Open this page in a browser that supports WebAuthn to add one.
    confirm:
      title: Remove this passkey?
      description: '{{name}} will no longer sign you in. You cannot undo this.'
    toast_added: Your passkey was added
    toast_removed: Your passkey was removed
