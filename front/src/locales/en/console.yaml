    columns:
      identity: Identity
      email: Email
      status: Status
      created: Signed up
      roles: Roles
    no_email: no email
    status:
      disabled: Disabled
      active: Active
      pending_one: '{{count, number}} action'
      pending_other: '{{count, number}} actions'
    card:
      active: active
      disabled: disabled
      email_verified: email verified
      email_unverified: email unverified
      pending_one: '{{count, number}} pending action'
      pending_other: '{{count, number}} pending actions'
      signed_up: Signed up {{when}}
      flags:
        can_sign_in: Can sign in
        email_verified: Email verified
        nothing_required: Nothing required at next sign-in
    metrics:
      total:
