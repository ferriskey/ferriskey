    search_placeholder: Rechercher et attribuer des rôles…
    empty: Aucun rôle trouvé.
  attributes:
    columns:
      key: Clé
      value: Valeur
    empty: Aucun attribut.
    key_placeholder: Clé
    value_placeholder: Valeur
    add: Ajouter
  subgroups:
    name_placeholder: Nom du nouveau sous-groupe
    add: Ajouter
    empty: Aucun sous-groupe.
    browse: Afficher dans la liste
    child_count: ({{total}})
  create:
    title: Ajouter un sous-groupe
    description: Créer un sous-groupe sous « {{name}} ».
    description_unknown: Créer un sous-groupe.
