  tabs:
    members: Membres
    roles: Attribution des rôles
    attributes: Attributs
    subgroups: Sous-groupes
  members:
    title: Membres ({{total}})
    no_match: Aucun membre ne correspond à ces filtres.
    empty: Aucun membre direct.
    show_all: Afficher tous les membres
    remove: Retirer le membre
    status:
