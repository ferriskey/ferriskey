      # Même bouton une fois des comptes cochés, le chiffre est la taille de la sélection.
      submit_count: Ajouter ({{total}})
      added_one: '{{count}} membre ajouté'
      added_many: '{{count}} de membres ajoutés'
      added_other: '{{count}} membres ajoutés'
      failed_one: '{{count}} membre n''a pas pu être ajouté'
      failed_many: '{{count}} de membres n''ont pas pu être ajoutés'
      failed_other: '{{count}} membres n''ont pas pu être ajoutés'
  roles:
