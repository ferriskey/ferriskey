validation:
  name_required: Le nom est obligatoire
  alias_required: L'alias est obligatoire
  alias_pattern:
    create: Uniquement des lettres minuscules, des chiffres, des traits d'union et des tirets bas
    settings: L'alias ne peut contenir que des lettres minuscules, des chiffres, des traits d'union ou des tirets bas
