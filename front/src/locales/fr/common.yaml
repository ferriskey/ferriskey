  import_failed: Échec de l'import
  import_invalid_json: Ce fichier n'est pas un JSON valide.
  attribute:
    deleted: Attribut supprimé
  client:
    updated: 'Le client {{name}} a été mis à jour'
    scope_assigned:
      default: Scope attribué par défaut
      optional: Scope attribué comme optionnel
    scope_assign_failed: Échec de l'attribution du scope
    scope_unassigned:
      default: Scope par défaut retiré
      optional: Scope optionnel retiré
    scope_unassign_failed: Échec du retrait du scope
  client_scope:
    created: Scope client créé
    create_failed: Échec de la création du scope client
    updated: Scope client mis à jour
    update_failed: Échec de la mise à jour du scope client
    deleted: Scope client supprimé
    delete_failed: Échec de la suppression du scope client
  protocol_mapper:
    created: Mapper de protocole créé
    create_failed: Échec de la création du mapper de protocole
    updated: Mapper de protocole mis à jour
    update_failed: Échec de la mise à jour du mapper de protocole
    deleted: Mapper de protocole supprimé
    delete_failed: Échec de la suppression du mapper de protocole
  role:
    created: Rôle créé
    create_failed: Échec de la création du rôle
    updated: Rôle mis à jour
    updated_detail: 'Le rôle {{name}} a été mis à jour.'
    update_failed: Échec de la mise à jour du rôle
    permissions_updated: Permissions du rôle mises à jour
    permissions_updated_detail: 'Les permissions du rôle {{name}} ont été mises à jour.'
    deleted: Rôle supprimé
    deleted_detail: Le rôle a été supprimé du client.
    delete_failed: Échec de la suppression du rôle
  organization:
    created: 'Organisation « {{name}} » créée'
    updated: 'Organisation « {{name}} » mise à jour'
    deleted: Organisation supprimée
    member_removed: Membre retiré de l'organisation
    user_added: Utilisateur ajouté à l'organisation
    user_removed: Utilisateur retiré de l'organisation
  email_template:
    created: Modèle d'e-mail créé
    saved: Modèle d'e-mail enregistré
    imported: Modèle d'e-mail importé
    deleted: Modèle d'e-mail supprimé
  portal_layout:
    created: Mise en page du portail créée
    saved: Mise en page du portail enregistrée
    deleted: Mise en page du portail supprimée
    default_updated: Mise en page du portail par défaut mise à jour
    imported: Mise en page du portail importée
  maintenance:
    client_entry_added: Entrée de la liste d'autorisation ajoutée
    client_entry_removed: Entrée de la liste d'autorisation retirée
    realm_entry_added: Entrée de la liste d'autorisation du realm ajoutée
    realm_entry_removed: Entrée de la liste d'autorisation du realm retirée
  password_reset:
    link_sent: Si un compte existe avec cet e-mail, un lien de réinitialisation a été envoyé
    link_failed: Échec de l'envoi du lien de réinitialisation
    reset_failed: Échec de la réinitialisation du mot de passe
  smtp:
    saved: Configuration SMTP enregistrée
    save_failed: Échec de l'enregistrement de la configuration SMTP
    deleted: Configuration SMTP supprimée
    delete_failed: Échec de la suppression de la configuration SMTP
  saml:
    sp_configured: Fournisseur de service configuré
    sp_updated: Fournisseur de service mis à jour
    sp_save_failed: Impossible d'enregistrer le fournisseur de service
    # {{name}} est le nom d'attribut saisi par l'administrateur.
    attribute_mapped: 'Attribut {{name}} mappé'
    attribute_map_failed: Impossible de mapper l'attribut
    attribute_removed: Mappage d'attribut retiré
    attribute_remove_failed: Impossible de retirer le mappage d'attribut

portal_input:
  show_password: Afficher le mot de passe
  hide_password: Masquer le mot de passe

toaster:
  label: Notifications
