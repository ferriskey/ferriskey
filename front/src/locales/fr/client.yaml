    public: public
    confidential: confidentiel
  state:
    enabled: activé
    disabled: désactivé
  status:
    enabled: Activé
    disabled: Désactivé
  in_maintenance: en maintenance
  registration_source:
    dynamic: Dynamique
    metadata_document: Document de métadonnées
  no_description: Aucune description
  discard: Abandonner
  save: Enregistrer les modifications
  unsaved_one: '{{count}} modification non enregistrée'
  unsaved_many: '{{count}} de modifications non enregistrées'
  unsaved_other: '{{count}} modifications non enregistrées'

choices:
  protocol:
    openid_connect:
      label: OpenID Connect
      description: Connexion par jeton, pour les applications web, les SPA, les applications mobiles et les API.
    saml:
      label: SAML 2.0
      description: Connexion par assertion, pour les applications qui ne parlent que SAML.
  state:
    enabled:
      label: Activé
      description: Le client peut demander une authentification.
    disabled:
      label: Désactivé
      description: Toutes les requêtes sont rejetées, la configuration est conservée.
  authentication:
    confidential:
      label: Confidentiel
      description: Le client prouve son identité avec un secret conservé côté serveur.
    public:
      label: Public
      description: 'Pas de secret : pour les SPA, les applications mobiles et les CLI.'
    immutable: 'Défini à la création : un client ne peut ensuite plus passer de confidentiel à public, ni l''inverse.'
  maintenance_state:
    open:
      label: Ouvert
      description: Le client s'authentifie normalement.
    maintenance:
      label: En maintenance
      description: Seule la liste d'autorisation passe.
  session_strategy:
    expire:
      label: Expiration naturelle
      description: Les sessions ouvertes durent jusqu'à leur terme.
    terminate:
      label: Terminer immédiatement
      description: Toutes les sessions sont coupées sur-le-champ.

list:
  title: Clients
  description: Applications et services autorisés à demander une authentification.
  create: Nouveau client
  columns:
