authentication:
  sign_in:
    title: Méthodes de connexion
    description: Ce que les personnes de ce realm peuvent utiliser pour prouver leur identité.
    loading_failed:
      title: Méthodes de connexion indisponibles
      description: Ce realm ne comporte aucun paramètre que la console puisse lire.
    smtp_warning: 'Le lien magique, la vérification de l''e-mail et la récupération du mot de passe envoient tous un message, et ce realm n''a aucune configuration SMTP enregistrée. Chacun d''eux échoue silencieusement pour la personne qui se connecte tant qu''un serveur n''est pas configuré dans Image de marque, onglet SMTP des modèles d''e-mail.'
    identifiers:
      title: Identifiants
      description: Ce que la personne saisit sur la page de connexion pour désigner son compte.
      label: Identifiants acceptés
      description_row: Les deux peuvent être acceptés en même temps. L'ordre détermine lequel est essayé en premier quand une valeur correspond à deux comptes.
      min_selected: Sélectionnez au moins un identifiant
      username:
        label: Nom d'utilisateur
        description: Le nom choisi par la personne à l'ouverture du compte.
      email:
        label: E-mail
        description: L'adresse e-mail enregistrée sur le compte.
    passwordless:
      title: Méthodes sans mot de passe
      description: Proposées à côté du champ de mot de passe. Un mot de passe reste toujours accepté.
      passkey_label: Clé d'accès
      passkey_description: La page de connexion propose un bouton de clé d'accès. La personne déverrouille son appareil avec une empreinte digitale, un visage ou une clé de sécurité et ne saisit jamais de mot de passe.
      magic_link_label: Lien magique
      magic_link_description: La personne saisit son adresse e-mail et reçoit un lien de connexion à usage unique. L'ouverture du lien la connecte sans mot de passe.
      magic_link_ttl_label: Validité du lien magique
      magic_link_ttl_description: Durée pendant laquelle le lien reste utilisable après l'envoi du message. Passé ce délai, la personne doit en demander un autre.
      minutes: minutes
    mfa:
      title: Authentification multifacteur
      description: Un second facteur demandé une fois le premier réussi.
      label: Exiger un second facteur
      description_row: Tous les membres de ce realm doivent saisir un code à usage unique après leur mot de passe. Les comptes sans second facteur enregistré sont dirigés vers l'écran d'enrôlement avant de pouvoir continuer.
    access:
      title: Accès au compte
      description: Les liens et cases à cocher que la page de connexion propose autour du formulaire.
      registration_label: Inscription libre
      registration_description: 'Un lien « Créer un compte » apparaît sur la page de connexion et n''importe qui peut ouvrir un compte sans opérateur.'
      email_verification_label: Vérification de l'e-mail
      email_verification_description: Un nouveau compte doit confirmer son adresse e-mail à partir d'un message avant que sa première connexion n'aboutisse.
      forgot_password_label: Récupération du mot de passe
      forgot_password_description: 'Un lien « Mot de passe oublié » apparaît sur la page de connexion et envoie un message de réinitialisation à l''adresse du compte.'
      remember_me_label: Rester connecté
      remember_me_description: 'Une case « Se souvenir de moi » apparaît sur la page de connexion et conserve la session après le redémarrage du navigateur.'
    account_chooser:
      title: Sélecteur de compte
      description: Comment la page de connexion traite les personnes qui se sont déjà connectées avec un compte sur ce navigateur.
      enabled_label: Proposer un sélecteur de compte
      enabled_description: Une personne qui s'est connectée avec un ou plusieurs comptes sur ce navigateur peut en choisir un au lieu de ressaisir ses identifiants.
      show_email_label: Afficher les adresses e-mail masquées
      show_email_description: Le sélecteur affiche une adresse e-mail masquée à côté de chaque compte. Activez-le seulement si le nom seul ne suffit pas à distinguer les comptes.
    protection:
      title: Protection de la connexion
      description: Ce qui se passe après des échecs répétés sur le même compte.
      threshold_label: Tentatives échouées avant verrouillage
      threshold_description: Nombre de mots de passe erronés consécutifs qui verrouillent le compte. 0 ne le verrouille jamais.
      attempts: tentatives
      duration_label: Durée du verrouillage
      duration_description: Durée pendant laquelle un compte verrouillé refuse tout mot de passe avant d'en accepter de nouveau un.
      seconds: secondes
    summary:
      passkey_on: Clé d'accès proposée
      passkey_off: Clé d'accès masquée
      magic_link_on: Lien magique proposé
      magic_link_off: Lien magique masqué
      mfa_on: Second facteur exigé
      mfa_off: Second facteur facultatif
      lockout_on_one: Verrouille après {{count, number}} tentative échouée
      lockout_on_many: Verrouille après {{count, number}} de tentatives échouées
      lockout_on_other: Verrouille après {{count, number}} tentatives échouées
      lockout_off: Ne verrouille jamais un compte
    save_bar:
      title_one: '{{count, number}} modification non enregistrée'
      title_many: '{{count, number}} de modifications non enregistrées'
      title_other: '{{count, number}} modifications non enregistrées'
      description: Ces modifications prennent effet à la prochaine connexion à ce realm.
      cancel: Annuler
      saving: Enregistrement…
      submit: Enregistrer les modifications
    validation:
      aliases_required: Sélectionnez au moins un identifiant
      magic_link_ttl: Un lien magique doit rester valide au moins une minute
      not_negative: Ne peut pas être négatif
      lockout_without_duration: Un verrouillage sans durée ne libère jamais le compte
    toast:
      updated: Méthodes de connexion mises à jour.
      update_failed: Échec de la mise à jour des méthodes de connexion
  password_policy:
    title: Politique de mot de passe
    description: 'Les règles auxquelles un mot de passe de ce realm doit satisfaire, à l''inscription et à chaque réinitialisation.'
    loading_failed:
      title: Échec du chargement de la politique de mot de passe
      description: Ce realm n'a aucune politique de mot de passe que la console puisse lire.
    preview:
      title: Ce que voit la personne
      description: Les pages d'inscription et de réinitialisation reçoivent cinq de ces règles et les listent à côté du champ. Les autres ne sont vérifiées qu'à l'envoi.
      listed: Listées sur la page
      none: Rien — la page demande un mot de passe sans exigence indiquée.
      silent: 'Appliquées mais jamais listées : {{rules}}. La personne ne les découvre que par le message de rejet, après avoir envoyé un mot de passe.'
      expiry_one: Chaque mot de passe expire après {{count, number}} jour ; la personne est dirigée vers l'écran de réinitialisation à sa première connexion après cette date.
      expiry_many: Chaque mot de passe expire après {{count, number}} de jours ; la personne est dirigée vers l'écran de réinitialisation à sa première connexion après cette date.
      expiry_other: Chaque mot de passe expire après {{count, number}} jours ; la personne est dirigée vers l'écran de réinitialisation à sa première connexion après cette date.
    rules:
      min_length_one: Au moins {{count, number}} caractère
      min_length_many: Au moins {{count, number}} de caractères
      min_length_other: Au moins {{count, number}} caractères
      require_uppercase: Une lettre majuscule
      require_lowercase: Une lettre minuscule
      require_number: Un chiffre
      require_special: Un caractère spécial
      min_entropy_one: '{{count, number}} bit d''entropie'
      min_entropy_many: '{{count, number}} de bits d''entropie'
      min_entropy_other: '{{count, number}} bits d''entropie'
      forbid_common: 'Aucun mot de passe courant, nom d''utilisateur ou adresse e-mail'
      check_breached: Aucun mot de passe signalé comme compromis
    save_bar:
      title_one: '{{count, number}} modification non enregistrée'
      title_many: '{{count, number}} de modifications non enregistrées'
      title_other: '{{count, number}} modifications non enregistrées'
      description: 'Les mots de passe existants ne sont pas revérifiés ; les nouvelles règles s''appliquent à la prochaine inscription ou réinitialisation.'
      cancel: Annuler
      saving: Enregistrement…
      submit: Enregistrer les modifications
    toast:
      updated: Politique de mot de passe mise à jour.
      update_failed: Échec de la mise à jour de la politique de mot de passe

