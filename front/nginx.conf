server {
  listen 80;

  gzip on;
  gzip_disable "msie6";

  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_buffers 16 8k;
  gzip_http_version 1.1;
  gzip_min_length 256;
  gzip_types
    application/javascript
    text/css
    text/plain
    text/xml;

  server_tokens off;

  add_header Strict-Transport-Security 'max-age=31536000; includeSubDomains; preload' always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;
  add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'sha256-A643BmbChRG74z051c6gsAMQKI2+U7VGv/seGeiTvvA='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https:; connect-src 'self' http: https:; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;

  location / {
    root /usr/share/nginx/html;
    try_files $uri $uri/ /index.html;
  }
}
