{{- /* Validate chart values before rendering resources. */ -}}
{{- if and .Values.rbac.create (not .Values.operator.serviceAccount.create) -}}
{{- fail "rbac.create requires operator.serviceAccount.create to be true — the ClusterRoleBinding needs a ServiceAccount to bind to" -}}
{{- end -}}
{{- range .Values.operator.watchNamespaces }}
{{- if eq (trim (toString .)) "" }}
{{- fail "operator.watchNamespaces must not contain an empty namespace" -}}
{{- end }}
{{- end }}
{{- if .Values.operator.watchNamespaces }}
{{- range concat .Values.common.env .Values.operator.env }}
{{- if eq (.name | default "" | toString) "WATCH_NAMESPACES" }}
{{- fail "common.env and operator.env must not define WATCH_NAMESPACES — operator.watchNamespaces already sets it" -}}
{{- end }}
{{- end }}
{{- end }}
