{{- if and .Values.rbac.create (not .Values.operator.watchNamespaces) }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "ferriskey-operator.operator.clusterRoleName" . }}
  labels:
    {{- include "ferriskey-operator.operator.labels" . | nindent 4 }}
rules:
  {{- include "ferriskey-operator.operator.rbacRules" . | nindent 2 }}
{{- end }}
