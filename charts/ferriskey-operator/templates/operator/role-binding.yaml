{{- if and .Values.rbac.create .Values.operator.watchNamespaces }}
{{- range .Values.operator.watchNamespaces }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "ferriskey-operator.operator.roleBindingName" $ }}
  namespace: {{ . }}
  labels:
    {{- include "ferriskey-operator.operator.labels" $ | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "ferriskey-operator.operator.roleName" $ }}
subjects:
  - kind: ServiceAccount
    name: {{ include "ferriskey-operator.operator.serviceAccountName" $ }}
    namespace: {{ $.Release.Namespace }}
{{- end }}
{{- end }}
