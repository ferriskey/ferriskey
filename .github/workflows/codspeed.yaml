name: codspeed

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/codspeed.yaml
      - benches/**
      - core/**
      - libs/**
      - Cargo.toml
      - Cargo.lock
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  benchmarks:
    name: benchmarks
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: set up rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f
        with:
          cache: false

      - name: cache rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: codspeed
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: install cargo-codspeed
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283
        with:
          tool: cargo-codspeed

      - name: build the benchmarks
        run: cargo codspeed build -p ferriskey-benchmarks

      - name: run the benchmarks
        uses: CodSpeedHQ/action@821a40cd6c80e3cfe387caf55668287addd808da
        with:
          mode: simulation
          run: cargo codspeed run -p ferriskey-benchmarks
