name: codspeed

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/codspeed.yaml
      - benches/**
      - core/**
      - libs/**
      - Cargo.toml
      - Cargo.lock
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  benchmarks:
    name: benchmarks
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: set up rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30
        with:
          cache: false

      - name: cache rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: codspeed
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: install cargo-codspeed
        uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2
        with:
          tool: cargo-codspeed

      - name: build the benchmarks
        run: cargo codspeed build -p ferriskey-benchmarks

      - name: run the benchmarks
        uses: CodSpeedHQ/action@af75f77f17a054769abefaa42fe8dc2975469b5f
        with:
          mode: simulation
          run: cargo codspeed run -p ferriskey-benchmarks
