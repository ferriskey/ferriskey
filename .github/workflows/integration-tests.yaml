name: integration-tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  device-flow:
    name: integration suites
    runs-on: ubuntu-latest

    # DB-backed integration tests are `#[ignore]` so a normal `cargo test`
    # skips them. This dedicated job provides the Postgres they need and runs
    # them explicitly with `--ignored`, keeping the rest of CI DB-free.
    services:
      postgres:
        image: postgres:18.2
        env:
          POSTGRES_USER: ferriskey
          POSTGRES_PASSWORD: ferriskey
          POSTGRES_DB: ferriskey
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_HOST: localhost
      DATABASE_PORT: "5432"
      DATABASE_NAME: ferriskey
      DATABASE_USER: ferriskey
      DATABASE_PASSWORD: ferriskey
      DATABASE_URL: postgres://ferriskey:ferriskey@localhost:5432/ferriskey

    steps:
      - name: checkout
        uses: actions/checkout@v5

      - name: set up rust toolchain
        id: rust
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: cache rust build
        uses: actions/cache@v4
        with:
          path: target
          key: it-${{ runner.arch }}-${{ steps.rust.outputs.cachekey }}-${{ hashFiles('Cargo.*', '**/*.rs') }}
          restore-keys: |
            it-${{ runner.arch }}-${{ steps.rust.outputs.cachekey }}-

      # The SAML signer is never validated by our own code: xmlsec1 is the
      # reference XML-DSig implementation and verifies the assertions we emit.
      - name: install xmlsec1
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xmlsec1

      - name: run saml xmlsec1 interop tests
        run: cargo test -p ferriskey-saml --test xmlsec_interop -- --ignored

      # End-to-end SAML IdP coverage (#1269): descriptor, SP-initiated SSO over
      # both bindings with the signed response verified by xmlsec1, and the
      # rejection cases (unknown SP, ACS mismatch, replayed authorization code).
      - name: run saml integration tests
        run: cargo test -p ferriskey-api --test saml_test -- --ignored

      - name: run device flow integration tests
        run: cargo test -p ferriskey-api --test device_flow_test -- --ignored

      # Single-test suite, so `router()` (and the process-wide Prometheus
      # recorder, see #1086) is constructed exactly once per process — safe to
      # run as its own invocation without the shared-runtime harness.
      - name: run nonce id_token integration test
        run: cargo test -p ferriskey-api --test nonce_id_token_test -- --ignored

      # Password policy enforcement: validates that the per-realm policy is
      # applied to all password-set flows and is readable without auth.
      - name: run password policy integration tests
        run: cargo test -p ferriskey-api --test password_policy_test -- --ignored

      # Account lockout / anti-brute-force (#1095): failed-login counter,
      # lock at threshold, admin unlock, and auto-recovery once the window
      # lapses. Each test uses its own victim user so the shared realm harness
      # stays parallel-safe.
      - name: run account lockout integration tests
        run: cargo test -p ferriskey-api --test account_lockout_test -- --ignored

      - name: run password import integration tests
        run: cargo test -p ferriskey-api --test password_import_test -- --ignored

      - name: run caller-supplied user id integration tests
        run: cargo test -p ferriskey-api --test supplied_user_id_test -- --ignored

      - name: run session management integration tests
        run: cargo test -p ferriskey-api --test session_management_test -- --ignored

      # Cross-application single sign-on (#1329): one login reaching a second,
      # confidential client without the login form, plus the refusals (expired or
      # unknown session, disabled account) and the shape of the FERRISKEY_SSO
      # cookie. The suite shares one `admin` user and toggles its `enabled` flag,
      # so the tests take an in-file lock rather than relying on --test-threads=1.
      - name: run SSO session integration tests
        run: cargo test -p ferriskey-api --test sso_session_test -- --ignored

      - name: run redirect_uri validation integration tests
        run: cargo test -p ferriskey-api --test redirect_uri_validation_test -- --ignored

      - name: run MFA bypass integration tests
        run: cargo test -p ferriskey-api --test mfa_bypass_test -- --ignored

      - name: run token revocation integration tests
        run: cargo test -p ferriskey-api --test token_revocation_test -- --ignored

      - name: run realm lifecycle integration tests
        run: cargo test -p ferriskey-api --test realm_lifecycle_test -- --ignored

      - name: run cross-realm user isolation integration tests
        run: cargo test -p ferriskey-api --test user_cross_realm_test -- --ignored

      - name: run users listing integration tests
        run: cargo test -p ferriskey-api --test users_listing_test -- --ignored

      - name: run realms listing integration tests
        run: cargo test -p ferriskey-api --test realms_listing_test -- --ignored

      - name: run roles listing integration tests
        run: cargo test -p ferriskey-api --test roles_listing_test -- --ignored

      - name: run clients listing integration tests
        run: cargo test -p ferriskey-api --test clients_listing_test -- --ignored

      - name: run client scopes listing integration tests
        run: cargo test -p ferriskey-api --test client_scopes_listing_test -- --ignored

      - name: run webhooks listing integration tests
        run: cargo test -p ferriskey-api --test webhooks_listing_test -- --ignored

      - name: run webhook deliveries listing integration tests
        run: cargo test -p ferriskey-api --test webhook_deliveries_listing_test -- --ignored

      - name: run organizations listing integration tests
        run: cargo test -p ferriskey-api --test organizations_listing_test -- --ignored

      - name: run organization groups listing integration tests
        run: cargo test -p ferriskey-api --test organization_groups_listing_test -- --ignored

      - name: run group members listing integration tests
        run: cargo test -p ferriskey-api --test group_members_listing_test -- --ignored

      - name: run organization members listing integration tests
        run: cargo test -p ferriskey-api --test organization_members_listing_test -- --ignored

      - name: run identity providers listing integration tests
        run: cargo test -p ferriskey-api --test identity_providers_listing_test -- --ignored

      - name: run federation providers listing integration tests
        run: cargo test -p ferriskey-api --test federation_providers_listing_test -- --ignored

      - name: run user sessions listing integration tests
        run: cargo test -p ferriskey-api --test user_sessions_listing_test -- --ignored

      - name: run compass flows listing integration tests
        run: cargo test -p ferriskey-api --test compass_flows_listing_test -- --ignored

      - name: run security events listing integration tests
        run: cargo test -p ferriskey-api --test security_events_listing_test -- --ignored

      - name: run portal themes listing integration tests
        run: cargo test -p ferriskey-api --test portal_themes_listing_test -- --ignored

      - name: run portal layouts listing integration tests
        run: cargo test -p ferriskey-api --test portal_layouts_listing_test -- --ignored

      - name: run email templates listing integration tests
        run: cargo test -p ferriskey-api --test email_templates_listing_test -- --ignored

      - name: run cross-realm client isolation integration tests
        run: cargo test -p ferriskey-api --test client_cross_realm_test -- --ignored

      - name: run cross-realm organization isolation integration tests
        run: cargo test -p ferriskey-api --test organization_cross_realm_test -- --ignored

      - name: run cross-realm credential isolation integration tests
        run: cargo test -p ferriskey-api --test credential_cross_realm_test -- --ignored

      - name: run cross-realm role isolation integration tests
        run: cargo test -p ferriskey-api --test role_cross_realm_test -- --ignored

      - name: run cross-realm auth session isolation integration tests
        run: cargo test -p ferriskey-api --test auth_session_cross_realm_test -- --ignored

      - name: run cross-realm maintenance whitelist isolation integration tests
        run: cargo test -p ferriskey-api --test maintenance_cross_realm_test -- --ignored

      - name: run cross-realm abyss isolation integration tests
        run: cargo test -p ferriskey-api --test abyss_cross_realm_test -- --ignored

      - name: run cross-realm session and compass isolation integration tests
        run: cargo test -p ferriskey-api --test session_cross_realm_test -- --ignored

      - name: run cross-realm client scope isolation integration tests
        run: cargo test -p ferriskey-api --test scope_cross_realm_test -- --ignored

      - name: run cross-realm observability isolation integration tests
        run: cargo test -p ferriskey-api --test observability_cross_realm_test -- --ignored

      - name: run cross-realm saml isolation integration tests
        run: cargo test -p ferriskey-api --test saml_cross_realm_test -- --ignored

      - name: run cross-realm trident isolation integration tests
        run: cargo test -p ferriskey-api --test trident_cross_realm_test -- --ignored

      - name: run cross-realm realm administration isolation integration tests
        run: cargo test -p ferriskey-api --test realm_cross_realm_test -- --ignored

      - name: run cross-realm openid connect isolation integration tests
        run: cargo test -p ferriskey-api --test oidc_cross_realm_test -- --ignored

      - name: run seawatch integration tests
        run: cargo test -p ferriskey-api --test seawatch_test -- --ignored

      - name: run consent integration tests
        run: cargo test -p ferriskey-api --test consent_test -- --ignored

      # Every test in this file shares one realm, and the CORS origin cache
      # (RealmOriginCache) is keyed by realm name alone — running them
      # concurrently races on that shared cache entry. --test-threads=1
      # keeps the shared-fixture design without touching the cache's
      # granularity for a test-only concern.
      - name: run web origin integration tests
        run: cargo test -p ferriskey-api --test web_origin_test -- --ignored --test-threads=1

      # Self-service account profile (#995, first iteration): GET/PUT /me
      # and the realm-gated username edit.
      - name: run self-service account profile integration tests
        run: cargo test -p ferriskey-api --test me_profile_test -- --ignored

      # Self-service account security (#1482): elevation is required and is
      # bound to one account and one session, a refused re-authentication mints
      # nothing, a password change rotates the credential without signing the
      # caller out, and the credential listing hands back no secret material.
      - name: run self-service account security integration tests
        run: cargo test -p ferriskey-api --test account_security_test -- --ignored

      # First ferriskey-core suite wired into CI. The repository tests of `core`
      # read DATABASE_URL (a different dialect from the DATABASE_* variables the
      # api suites use) and create one throwaway schema per test, so they are
      # safe to run against the same service. Filtered by module name because
      # these are in-source unit tests, not a `--test <name>` target.
      - name: run webhook delivery outbox repository tests
        run: cargo test -p ferriskey-core webhook_delivery -- --ignored

      # Delivery history and manual replay (#1336): realm/webhook scoping,
      # page-size rejection, replay conflict on a non-terminal delivery.
      - name: run webhook delivery API integration tests
        run: cargo test -p ferriskey-api --test webhook_delivery_api_test -- --ignored

      # Token exchange delegation policies (#1064): admin CRUD, conflicts and
      # realm isolation.
      - name: run token exchange policy integration tests
        run: cargo test -p ferriskey-api --test token_exchange_policy_test -- --ignored

      # RFC 8693 exchange (#1053, #1062, #1054): the exchange rules against the
      # real key store and access token table, and the token endpoint wire
      # format (200 body, 401 challenge, RFC 6749 error codes).
      - name: run token exchange integration tests
        run: cargo test -p ferriskey-api --test token_exchange_test -- --ignored

      # OIDC Back-Channel Logout (#1400): a loopback relying party receives a
      # logout token, verified against the realm JWKS, for every way a
      # session ends.
      - name: run back-channel logout integration tests
        run: cargo test -p ferriskey-api --test backchannel_logout_test -- --ignored

      - name: run PKCE integration tests
        run: cargo test -p ferriskey-api --test pkce_test -- --ignored

      - name: run refresh token rotation integration tests
        run: cargo test -p ferriskey-api --test refresh_token_rotation_test -- --ignored

      - name: run token endpoint client authentication integration tests
        run: cargo test -p ferriskey-api --test token_basic_auth_test -- --ignored

      - name: run OIDC conformance integration tests
        run: cargo test -p ferriskey-api --test oidc_conformance_test -- --ignored
