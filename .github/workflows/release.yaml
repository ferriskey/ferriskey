name: release

on:
  push:
    tags:
      - v*.*.*
      - v*.*.*-rc*

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    # id-token lets cosign get an OIDC token for keyless signing.
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: check prerelease
        id: prerelease
        run: |
          if [[ "$GITHUB_REF" == *"-rc"* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      # GitHub's own source archives are generated on request and ship no
      # checksum, so the release carries its own archive, built from the
      # tagged commit, next to a sha256 manifest. The archive can be rebuilt
      # from the tag; its bytes may differ across git versions, which is why
      # the checksums are signed rather than recomputed by users.
      - name: build source archive
        id: archive
        env:
          TAG: ${{ github.ref_name }}
        run: |
          dir="$RUNNER_TEMP/release"
          mkdir -p "$dir"
          git archive --format=tar.gz --prefix="ferriskey-$TAG/" -o "$dir/ferriskey-$TAG-src.tar.gz" HEAD
          (cd "$dir" && sha256sum ./*.tar.gz > "ferriskey-$TAG-checksums.txt")
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
          echo "checksums=ferriskey-$TAG-checksums.txt" >> "$GITHUB_OUTPUT"

      - name: install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      # Keyless: the signature is bound to this workflow's OIDC identity and
      # recorded in the Sigstore transparency log. To verify a download:
      #   cosign verify-blob ferriskey-<tag>-checksums.txt \
      #     --bundle ferriskey-<tag>-checksums.txt.sigstore.json \
      #     --certificate-oidc-issuer https://token.actions.githubusercontent.com \
      #     --certificate-identity-regexp '^https://github.com/ferriskey/ferriskey/\.github/workflows/release\.yaml@'
      #   sha256sum --check ferriskey-<tag>-checksums.txt
      - name: sign checksums
        working-directory: ${{ steps.archive.outputs.dir }}
        env:
          CHECKSUMS: ${{ steps.archive.outputs.checksums }}
        run: cosign sign-blob --yes --bundle "$CHECKSUMS.sigstore.json" "$CHECKSUMS"

      # SLSA build provenance for the archive and its checksums. Scorecard
      # looks for a *.intoto.jsonl asset on the release, so the bundle is
      # published under that name. To verify a download:
      #   gh attestation verify ferriskey-<tag>-src.tar.gz --repo ferriskey/ferriskey
      - name: attest provenance
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            ${{ steps.archive.outputs.dir }}/*.tar.gz
            ${{ steps.archive.outputs.dir }}/*-checksums.txt

      - name: collect provenance
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
          DIR: ${{ steps.archive.outputs.dir }}
          TAG: ${{ github.ref_name }}
        run: cp "$BUNDLE" "$DIR/ferriskey-$TAG.intoto.jsonl"

      - name: release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          generate_release_notes: true
          prerelease: ${{ steps.prerelease.outputs.prerelease }}
          files: ${{ steps.archive.outputs.dir }}/*
          fail_on_unmatched_files: true
