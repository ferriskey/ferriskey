name: pre-commit

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    env:
      # Clippy runs in the rust workflow, which only starts when Rust changes.
      SKIP: rust-clippy
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: set up rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f
        with:
          components: rustfmt
          cache: false

      - name: set up python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0

      - name: set up node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24

      - name: install pnpm
        run: |
          npm ci --prefix tools/pnpm --ignore-scripts
          echo "$GITHUB_WORKSPACE/tools/pnpm/node_modules/.bin" >> "$GITHUB_PATH"

      - name: cache node modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: front/node_modules
          key: node-${{ runner.arch }}-${{ hashFiles('front/pnpm-lock.yaml') }}

      - name: install node modules
        working-directory: front
        run: pnpm install --frozen-lockfile

      - name: run pre-commit
        uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd
