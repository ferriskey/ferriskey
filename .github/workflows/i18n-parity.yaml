name: i18n-parity

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  parity:
    name: catalogue parity
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: set up node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24

      - name: install pnpm
        run: |
          npm ci --prefix tools/pnpm --ignore-scripts
          echo "$GITHUB_WORKSPACE/tools/pnpm/node_modules/.bin" >> "$GITHUB_PATH"

      - name: cache node modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: front/node_modules
          key: node-${{ runner.arch }}-${{ hashFiles('front/pnpm-lock.yaml') }}
          restore-keys: |
            node-${{ runner.arch }}-

      - name: install node modules
        working-directory: front
        run: pnpm install

      - name: run i18n tests
        working-directory: front
        run: pnpm run test:i18n

      - name: check catalogue parity
        working-directory: front
        run: pnpm run i18n:parity
